<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMC-CE Turret & Ammunition Database</title>
    <meta name="description" content="End-user wiki and interactive stats database for Absolutely More Cannons (Combat Extended Version).">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Modular CSS Stylesheets -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/turret-card.css">
    <link rel="stylesheet" href="css/detail-modal.css">
    <link rel="stylesheet" href="css/ammo-view.css">
</head>
<body>
    <!-- Top Bar Navigation Header -->
    <header class="app-header">
        <div class="header-container">
            <div class="brand-title-group">
                <div class="logo-badge">AMC-CE</div>
                <div class="title-meta">
                    <h1 class="app-title">Turret & Ammunition Stats Index</h1>
                    <span class="sub-title">Combat Extended 1.6 • Interactive Encyclopedia</span>
                </div>
            </div>
            
            <div class="header-controls">
                <!-- Search Box -->
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search by name, caliber, or shell type..." aria-label="Search turrets and ammo">
                    <button id="clear-search" class="clear-btn" title="Clear Search" style="display: none;">&times;</button>
                </div>
            </div>
        </div>

        <!-- Filter Bar -->
        <nav class="filter-bar">
            <div class="filter-group">
                <span class="filter-label">Categories:</span>
                <div class="filter-pills" id="category-pills">
                    <button class="pill active" data-category="all">All Turrets</button>
                    <button class="pill" data-category="Autocannons">Autocannons</button>
                    <button class="pill" data-category="Cannons">Cannons</button>
                    <button class="pill" data-category="Howitzers">Howitzers</button>
                    <button class="pill" data-category="Naval Guns">Naval Guns</button>
                    <button class="pill" data-category="Rotary Cannons">Rotary Cannons</button>
                    <button class="pill" data-category="Unmanned">Unmanned</button>
                </div>
            </div>

            <div class="filter-group secondary-filters">
                <span class="filter-label">Features:</span>
                <div class="filter-pills" id="feature-pills">
                    <button class="pill feature-pill" data-feature="Dual Mode">🔄 Dual Mode</button>
                    <button class="pill feature-pill" data-feature="Enclosed Protection">🛡️ Enclosed</button>
                    <button class="pill feature-pill" data-feature="CIWS Air Defense">🎯 CIWS</button>
                    <button class="pill feature-pill" data-feature="Cross-Map Shelling">🌐 Shelling</button>
                    <button class="pill feature-pill" data-feature="Variable RPM">⚡ Variable RPM</button>
                    <button class="pill feature-pill" data-feature="Airburst / Flak">💥 Airburst</button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="app-main">
        <div class="stats-counter-bar">
            <div id="turret-counter" class="counter-text">Showing <strong>0</strong> of <strong>0</strong> turrets</div>
            <div class="sort-controls">
                <label for="sort-select">Sort by:</label>
                <select id="sort-select" aria-label="Sort turrets">
                    <option value="name">Name (A-Z)</option>
                    <option value="category">Category</option>
                    <option value="hp">Max HP (High-Low)</option>
                    <option value="range">Max Range (High-Low)</option>
                    <option value="cost">Work to Build</option>
                </select>
            </div>
        </div>

        <!-- Turret Grid Container -->
        <section id="turret-grid" class="turret-grid" aria-live="polite">
            <!-- Rendered dynamically by turretCard.js -->
        </section>

        <div id="no-results" class="empty-state" style="display: none;">
            <div class="empty-icon">🔍</div>
            <h3>No turrets found</h3>
            <p>Try adjusting your search query or active filter pills.</p>
        </div>
    </main>

    <!-- Detail Modal Dialog -->
    <div id="detail-modal" class="modal-backdrop" aria-hidden="true">
        <div class="modal-dialog" role="dialog" aria-labelledby="modal-title">
            <button id="modal-close" class="modal-close-btn" aria-label="Close modal">&times;</button>
            
            <header class="modal-header">
                <div class="modal-header-left">
                    <div id="modal-thumb-container" class="modal-thumb"></div>
                    <div class="modal-title-group">
                        <span id="modal-category-badge" class="cat-tag">Category</span>
                        <h2 id="modal-title" class="modal-title-text">Turret Title</h2>
                        <span id="modal-caliber" class="caliber-text">Caliber</span>
                    </div>
                </div>

                <!-- Dual Mode Toggle (Active for Dual Mode Turrets) -->
                <div id="mode-switch-container" class="mode-switch-wrapper" style="display: none;">
                    <span class="mode-switch-label">Fire Mode:</span>
                    <div class="mode-toggle-group">
                        <button id="mode-btn-direct" class="mode-toggle-btn active" data-mode="direct">Direct Fire</button>
                        <button id="mode-btn-indirect" class="mode-toggle-btn" data-mode="indirect">Indirect Fire</button>
                    </div>
                </div>
            </header>

            <!-- Modal Nav Tabs -->
            <nav class="modal-tabs">
                <button class="tab-btn active" data-tab="tab-overview">Overview & Building</button>
                <button class="tab-btn" data-tab="tab-ballistics">Fire Control & Ballistics</button>
                <button class="tab-btn" data-tab="tab-specialized">Specialized Features</button>
                <button class="tab-btn" data-tab="tab-ammo">Ammunition & Shells (<span id="ammo-count-badge">0</span>)</button>
            </nav>

            <!-- Modal Content Panels -->
            <div class="modal-body">
                <!-- Tab 1: Overview & Building -->
                <div id="tab-overview" class="tab-panel active"></div>
                
                <!-- Tab 2: Fire Control & Ballistics -->
                <div id="tab-ballistics" class="tab-panel"></div>
                
                <!-- Tab 3: Specialized Features -->
                <div id="tab-specialized" class="tab-panel"></div>
                
                <!-- Tab 4: Ammunition & Shells -->
                <div id="tab-ammo" class="tab-panel"></div>
            </div>
        </div>
    </div>

    <!-- Modular JS App Loading -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
